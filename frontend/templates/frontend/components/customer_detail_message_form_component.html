<form id="detailMessageForm" class="customer-form" hidden>
    <label>Channel <select id="detailMessageChannel"><option value="sms">SMS</option><option value="email">E-mail</option><option value="whatsapp">WhatsApp</option></select></label>
    <label>Message <textarea id="detailMessageText" maxlength="500" required placeholder="Write a message..."></textarea></label>
    <div class="form-actions"><button class="customer-primary" type="submit">Prepare message</button></div>
</form>
