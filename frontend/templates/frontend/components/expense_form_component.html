<form id="expenseForm" class="custom-form">
    <div class="form-group">
        <label for="expenseItemName">Item Name <span class="required">*</span></label>
        <input id="expenseItemName" list="expenseItemOptions" required placeholder="e.g., Water, Soap, Transport" autocomplete="off">
        <datalist id="expenseItemOptions"></datalist>
        <small class="form-hint">Type to search existing items or enter a new one.</small>
    </div>
    
    <div class="form-group">
        <label for="expenseAmount">Amount Spent (KES) <span class="required">*</span></label>
        <input id="expenseAmount" type="number" min="0.01" step="0.01" required placeholder="0.00">
    </div>

    <div class="form-actions">
        <button type="button" class="btn-cancel" data-close-modal="expenseModal">Cancel</button>
        <button class="btn-primary" type="submit">Record Expense</button>
    </div>
</form>
