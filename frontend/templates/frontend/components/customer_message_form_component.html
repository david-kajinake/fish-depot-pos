<form id="customerMessageForm" class="customer-form"><label>Customer group <select id="messageGroup"><option value="all">All customers</option><option value="active">Active customers</option><option value="inactive">Inactive customers</option></select></label><label>Message channel <select id="messageChannel"><option value="sms">SMS</option><option value="email">Email</option><option value="whatsapp">WhatsApp</option></select></label><label>Message <textarea id="messageText" maxlength="500" required placeholder="Write a customer message..."></textarea></label><div class="form-actions"><button class="customer-primary" type="submit">Prepare recipients</button></div></form>
