<form id="sendCustomerStatementForm" class="customer-form">
    <label>Statement destination email <input id="customerStatementEmail" type="email" required placeholder="recipient@example.com"></label>
    <label>Current account password <input id="customerStatementPassword" type="password" required autocomplete="current-password"></label>
    <p class="form-hint">Your password confirms that you are allowed to send this financial statement.</p>
    <div class="form-actions"><button type="button" id="cancelCustomerStatement">Cancel</button><button class="customer-primary" type="submit">Send statement</button></div>
</form>
